
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de evidencias</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #333;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .barra-superior {
            height: 48px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 18px;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: 1px solid #d9dce2;
            background: #fff;
            color: #333;
            border-radius: 8px;
            padding: 9px 13px;
            font-size: 14px;
            transition: background .2s, border-color .2s;
        }

        button:hover {
            background: #edf0f5;
            border-color: #b8bec9;
        }

        .boton-cerrar {
            font-size: 20px;
            padding: 4px 12px;
            border: none;
            background: transparent;
        }

        .zona-imagen {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow: auto;
            overscroll-behavior: contain;
            cursor: default;
        }

        .lienzo-imagen {
            display: grid;
            place-items: center;
            width: max-content;
            min-width: 100%;
            min-height: 100%;
            padding: 24px;
        }

        #imagen-evidencia {
            display: block;
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            object-fit: contain;
            border-radius: 3px;
            box-shadow: 0 3px 18px rgba(0, 0, 0, 0.10);
            user-select: none;
            -webkit-user-drag: none;
        }

        #imagen-evidencia.arrastrable {
            cursor: grab;
        }

        #imagen-evidencia.arrastrando {
            cursor: grabbing;
        }

        .mensaje-error {
            display: none;
            max-width: 420px;
            padding: 24px;
            margin: auto;
            text-align: center;
            line-height: 1.6;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .barra-controles {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 16px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
        }

        .grupo-zoom {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .boton-zoom {
            width: 40px;
            height: 38px;
            padding: 0;
            font-size: 21px;
        }

        #nivel-zoom {
            min-width: 58px;
            text-align: center;
            font-size: 13px;
            color: #555;
            font-variant-numeric: tabular-nums;
        }

        .boton-descargar {
            background: #263b63;
            color: white;
            border-color: #263b63;
        }

        .boton-descargar:hover {
            background: #1c2d4d;
            color: white;
        }

        @media (max-width: 520px) {
            .barra-controles {
                gap: 7px;
                padding: 10px 8px;
            }

            button {
                padding: 9px 10px;
                font-size: 13px;
            }

            .boton-zoom {
                width: 34px;
            }

            .lienzo-imagen {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="barra-superior">
        <button class="boton-cerrar" id="cerrar-visor"
                title="Cerrar visualizador" aria-label="Cerrar visualizador">
            ×
        </button>
    </div>

    <main class="zona-imagen" id="zona-imagen">
        <div class="lienzo-imagen" id="lienzo-imagen">
            <img id="imagen-evidencia" alt="Evidencia académica">
            <div class="mensaje-error" id="mensaje-error">
                <strong>No se pudo cargar la imagen.</strong>
                <p>Verifica que la ruta de la evidencia sea correcta y que el archivo exista.</p>
            </div>
        </div>
    </main>

    <footer class="barra-controles">
        <div class="grupo-zoom">
            <button class="boton-zoom" id="reducir" title="Alejar">−</button>
            <span id="nivel-zoom">100%</span>
            <button class="boton-zoom" id="ampliar" title="Acercar">+</button>
        </div>

        <button id="ajustar">Ajustar a pantalla</button>
        <button id="restablecer">Tamaño original</button>
        <button class="boton-descargar" id="descargar-imagen">
            Descargar
        </button>
    </footer>

    <script>
        const zona = document.getElementById("zona-imagen");
        const lienzo = document.getElementById("lienzo-imagen");
        const imagen = document.getElementById("imagen-evidencia");
        const mensajeError = document.getElementById("mensaje-error");
        const nivelZoom = document.getElementById("nivel-zoom");

        const botonReducir = document.getElementById("reducir");
        const botonAmpliar = document.getElementById("ampliar");
        const botonAjustar = document.getElementById("ajustar");
        const botonRestablecer = document.getElementById("restablecer");
        const botonDescargar = document.getElementById("descargar-imagen");
        const botonCerrar = document.getElementById("cerrar-visor");

        let zoom = 1;
        let imagenCargada = false;
        let arrastrando = false;
        let inicioX = 0;
        let inicioY = 0;
        let scrollInicialX = 0;
        let scrollInicialY = 0;

        const MIN_ZOOM = 0.1;
        const MAX_ZOOM = 5;

        // Conserva el formato de tus enlaces: visualizar.html?imagen=RUTA
        const parametros = new URLSearchParams(window.location.search);
        const rutaImagen = parametros.get("imagen");

        function actualizarEtiquetaZoom() {
            nivelZoom.textContent = Math.round(zoom * 100) + "%";
            botonReducir.disabled = zoom <= MIN_ZOOM;
            botonAmpliar.disabled = zoom >= MAX_ZOOM;
        }

        function aplicarZoom(nuevoZoom, puntoX, puntoY) {
            if (!imagenCargada) return;

            nuevoZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, nuevoZoom));

            const rectZona = zona.getBoundingClientRect();
            const anclaX = puntoX === undefined
                ? zona.clientWidth / 2
                : puntoX - rectZona.left;
            const anclaY = puntoY === undefined
                ? zona.clientHeight / 2
                : puntoY - rectZona.top;

            const rectImagen = imagen.getBoundingClientRect();

            const posicionImagenX = rectImagen.left - rectZona.left + zona.scrollLeft;
            const posicionImagenY = rectImagen.top - rectZona.top + zona.scrollTop;

            const proporcionX = Math.max(0, Math.min(1,
                (zona.scrollLeft + anclaX - posicionImagenX) / imagen.clientWidth
            ));

            const proporcionY = Math.max(0, Math.min(1,
                (zona.scrollTop + anclaY - posicionImagenY) / imagen.clientHeight
            ));

            zoom = nuevoZoom;
            imagen.style.width = (imagen.naturalWidth * zoom) + "px";
            imagen.style.height = (imagen.naturalHeight * zoom) + "px";

            actualizarEtiquetaZoom();

            requestAnimationFrame(() => {
                const nuevaRectImagen = imagen.getBoundingClientRect();
                const nuevaPosicionX =
                    nuevaRectImagen.left - rectZona.left + zona.scrollLeft;
                const nuevaPosicionY =
                    nuevaRectImagen.top - rectZona.top + zona.scrollTop;

                zona.scrollLeft = nuevaPosicionX
                    + proporcionX * imagen.clientWidth - anclaX;

                zona.scrollTop = nuevaPosicionY
                    + proporcionY * imagen.clientHeight - anclaY;
            });
        }

        function ajustarPantalla() {
            if (!imagenCargada) return;

            const espacioAncho = Math.max(100, zona.clientWidth - 60);
            const espacioAlto = Math.max(100, zona.clientHeight - 60);

            const escalaAncho = espacioAncho / imagen.naturalWidth;
            const escalaAlto = espacioAlto / imagen.naturalHeight;

            const escala = Math.min(escalaAncho, escalaAlto, 1);

            zoom = Math.max(MIN_ZOOM, escala);
            imagen.style.width = (imagen.naturalWidth * zoom) + "px";
            imagen.style.height = (imagen.naturalHeight * zoom) + "px";

            actualizarEtiquetaZoom();

            requestAnimationFrame(() => {
                zona.scrollLeft = 0;
                zona.scrollTop = 0;
            });
        }

        function restaurarTamanoOriginal() {
            aplicarZoom(1);
            requestAnimationFrame(() => {
                zona.scrollLeft = 0;
                zona.scrollTop = 0;
            });
        }

        function cerrarVisualizador() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        }

        if (rutaImagen) {
            imagen.src = rutaImagen;
        } else {
            mensajeError.style.display = "block";
            imagen.style.display = "none";
        }

        imagen.addEventListener("load", () => {
            imagenCargada = true;
            imagen.style.display = "block";
            mensajeError.style.display = "none";
            ajustarPantalla();
        });

        imagen.addEventListener("error", () => {
            imagenCargada = false;
            imagen.style.display = "none";
            mensajeError.style.display = "block";
        });

        botonReducir.addEventListener("click", () => {
            aplicarZoom(zoom - 0.2);
        });

        botonAmpliar.addEventListener("click", () => {
            aplicarZoom(zoom + 0.2);
        });

        botonAjustar.addEventListener("click", ajustarPantalla);
        botonRestablecer.addEventListener("click", restaurarTamanoOriginal);
        botonCerrar.addEventListener("click", cerrarVisualizador);

        botonDescargar.addEventListener("click", () => {
            if (!rutaImagen || !imagenCargada) return;

            const enlace = document.createElement("a");
            enlace.href = imagen.src;
            enlace.download = rutaImagen.split("/").pop() || "evidencia";
            document.body.appendChild(enlace);
            enlace.click();
            enlace.remove();
        });

        // Permite mover la imagen ampliada con el ratón.
        imagen.addEventListener("pointerdown", (evento) => {
            if (!imagenCargada || evento.button !== 0) return;

            arrastrando = true;
            inicioX = evento.clientX;
            inicioY = evento.clientY;
            scrollInicialX = zona.scrollLeft;
            scrollInicialY = zona.scrollTop;

            imagen.classList.add("arrastrando");
            imagen.setPointerCapture(evento.pointerId);
            evento.preventDefault();
        });

        imagen.addEventListener("pointermove", (evento) => {
            if (!arrastrando) return;

            zona.scrollLeft = scrollInicialX - (evento.clientX - inicioX);
            zona.scrollTop = scrollInicialY - (evento.clientY - inicioY);
        });

        function terminarArrastre() {
            arrastrando = false;
            imagen.classList.remove("arrastrando");
        }

        imagen.addEventListener("pointerup", terminarArrastre);
        imagen.addEventListener("pointercancel", terminarArrastre);
        imagen.addEventListener("lostpointercapture", terminarArrastre);

        // Ctrl + rueda del ratón permite acercar o alejar.
        zona.addEventListener("wheel", (evento) => {
            if (!evento.ctrlKey || !imagenCargada) return;

            evento.preventDefault();
            const factor = evento.deltaY < 0 ? 1.1 : 1 / 1.1;
            aplicarZoom(zoom * factor, evento.clientX, evento.clientY);
        }, { passive: false });

        // Escape permite volver a la página anterior.
        document.addEventListener("keydown", (evento) => {
            if (evento.key === "Escape") cerrarVisualizador();
        });

        window.addEventListener("resize", () => {
            if (imagenCargada) ajustarPantalla();
        });

        actualizarEtiquetaZoom();
    </script>

</body>
</html>
